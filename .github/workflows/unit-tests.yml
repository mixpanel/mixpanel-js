name: Unit Tests

on:
  push:
    branches: [master, '**/*-rc']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    # a leaked timer or handle keeps mocha running; fail instead of hanging for hours
    timeout-minutes: 15

    permissions:
      contents: read
      checks: write  # for dorny/test-reporter to post results

    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run test:ci
      - run: npm run build-dist

      - name: Test Report
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v2
        if: success() || failure()
        with:
          name: Unit Tests
          reporter: mocha-json
          path: 'tests/unit/results/*.json'
          list-tests: 'failed'
          fail-on-error: 'false'

