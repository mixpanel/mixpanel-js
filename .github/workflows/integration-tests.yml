name: Integration Tests

on:
  push:
    branches: [master, '**/*-rc']
  pull_request:

# A new push to a PR cancels its older run, which frees the Sauce tunnels and sessions it holds.
# Pushes to master and release branches each get their own group, so none of their runs is
# cancelled or skipped.
concurrency:
  group: integration-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Passing jobs take up to about an hour under load; a hung one would otherwise hold its Sauce
    # tunnel for GitHub's 6-hour default
    timeout-minutes: 120

    permissions:
      contents: read
      checks: write  # for dorny/test-reporter to post results

    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        browser: [chrome-latest, edge-latest, safari-latest, firefox-latest, ios-safari-sim, android-chrome-sim]

    env:
      SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
      SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}
      SAUCE_TUNNEL_NAME: ci-js-sdk-test-${{ matrix.browser }}-${{ github.run_id }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - name: Use Node.js 24.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24.x

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build-full

      - name: Sauce test
        # for some reason, android emulator tests don't work with localhost so we need an IP to give to the runner...
        run: BROWSER=${{ matrix.browser }} ROOT_DIR=$(pwd) SAUCE_HOST=$(hostname -I | awk '{print $1; exit}') npm run integration-test:sauce

      - name: Test Report
        uses: dorny/test-reporter@7b7927aa7da8b82e81e755810cb51f39941a2cc7 # v2
        if: success() || failure() # run this step even if previous step failed
        with:
          name: Browser Tests            # Name of the check run which will be created
          reporter: mocha-json        # Format of test results
          path: 'tests/browser/results/*.json'    # Path to test results
          list-tests: 'failed'
          fail-on-error: 'false'
